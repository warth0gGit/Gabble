name: Warble
options:
  bundleIdPrefix: com.warth0g
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "15"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    from: "0.18.0"
targets:
  Warble:
    type: application
    platform: macOS
    dependencies:
      - package: FluidAudio
    sources:
      - path: Warble/Sources
      - path: Warble/Resources
    info:
      path: Warble/Info.plist
      properties:
        CFBundleDisplayName: Warble
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: Warble listens to your microphone so it can turn your speech into text and transcribe calls.
        NSSpeechRecognitionUsageDescription: Warble uses on-device speech recognition to transcribe what you say.
        NSAudioCaptureUsageDescription: Warble records the other people on your calls so it can transcribe the whole conversation.
        NSCalendarsFullAccessUsageDescription: Warble reads meeting attendees and times so it can name speakers and file transcripts automatically.
    entitlements:
      path: Warble/Warble.entitlements
      properties:
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.warth0g.warble
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  WarbleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: WarbleTests
    dependencies:
      - target: Warble
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Warble.app/Contents/MacOS/Warble
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Warble:
    build:
      targets:
        Warble: all
        WarbleTests: [test]
    test:
      targets:
        - WarbleTests
